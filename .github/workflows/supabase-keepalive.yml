name: Supabase Keep Alive

on:
  schedule:
    # Runs every 2 days at 00:00 UTC (well within Supabase's 7-day inactivity pause window)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Supabase API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://qzdtwqloooilogskoayf.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SUPABASE_URL="$(echo "${SUPABASE_URL}" | tr -d '[:space:]')"
          SUPABASE_URL="${SUPABASE_URL%/}"
          
          # Extract project ref from URL (e.g. qzdtwqloooilogskoayf)
          PROJECT_REF=$(echo "${SUPABASE_URL}" | sed -E 's|https?://([^.]+)\.supabase\.co.*|\1|')
          
          # Prefer anon key, fallback to service_role key if available
          API_KEY="${SUPABASE_ANON_KEY:-$SUPABASE_SERVICE_ROLE_KEY}"
          API_KEY="$(echo "${API_KEY}" | tr -d '[:space:]')"

          echo "Pinging Supabase REST API for project ref: ${PROJECT_REF}..."
          set +e
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 30 \
            -H "apikey: ${API_KEY}" \
            -H "Authorization: Bearer ${API_KEY}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1")
          CURL_EXIT_CODE=$?
          set -e

          # If curl failed (e.g. host could not be resolved because project was paused)
          if [ "$CURL_EXIT_CODE" -ne 0 ] || [ "$HTTP_STATUS" -ge 500 ]; then
            echo "Warning: Direct ping failed (curl exit code: ${CURL_EXIT_CODE}, HTTP status: ${HTTP_STATUS})."
            
            # If Supabase Access Token is available, attempt auto-restore
            if [ -n "${SUPABASE_ACCESS_TOKEN}" ] && [ -n "${PROJECT_REF}" ]; then
              echo "Attempting automatic restore via Supabase Management API..."
              RESTORE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                "https://api.supabase.com/v1/projects/${PROJECT_REF}/restore")
              echo "Supabase restore API responded with HTTP: ${RESTORE_STATUS}"
              if [ "$RESTORE_STATUS" -eq 200 ] || [ "$RESTORE_STATUS" -eq 201 ]; then
                echo "Project restore initiated successfully! It will be active shortly."
                exit 0
              fi
            fi
            exit 1
          fi

          echo "Supabase responded with HTTP status: ${HTTP_STATUS}"
          # Must be 2xx (e.g. 200 OK) to guarantee the database actually processed the query
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully pinged Supabase database. Activity registered."
          else
            echo "Error: Unexpected response status ${HTTP_STATUS}. Request did not reach database."
            exit 1
          fi
